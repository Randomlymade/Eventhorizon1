<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gun Mayhem 2</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
#container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; }
#container ruffle-player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="container"></div>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.1.0-nightly.2023.10.2/ruffle.js"></script>
<script>
window.addEventListener("load", function () {
var ruffle = window.RufflePlayer.newest();
var player = ruffle.createPlayer();
player.style.width = "100%";
player.style.height = "100%";
document.getElementById("container").appendChild(player);
player.load("https://cdn.jsdelivr.net/gh/supaub/interstellar-3@8a13c735e7df6d86602b354e45c090405f21f45a/play/flash/swf/gmayhem2.swf");
});
</script>
</body>
</html>
