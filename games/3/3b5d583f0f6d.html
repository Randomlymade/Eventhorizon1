<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox File Embedder</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f2f5;
        }

        #upload-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        iframe {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div id="upload-container">
        <h2>File loader</h2>
        <p>Select an file to view it in a sandboxed environment.</p>
        <button onclick="document.getElementById('file-input').click()">Choose File</button>
        <input type="file" id="file-input" accept=".html,.htm,.txt" onchange="handleFile(this.files)">
    </div>

    <iframe id="sandbox-iframe" sandbox="allow-scripts"></iframe>

    <script>
        function handleFile(files) {
            const file = files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const iframe = document.getElementById('sandbox-iframe');
                const container = document.getElementById('upload-container');

                // Hide the UI
                container.style.display = 'none';
                document.body.style.backgroundColor = 'white';

                // Set iframe source and show it
                iframe.srcdoc = e.target.result;
                iframe.style.display = 'block';
            };

            reader.readAsText(file);
        }
    </script>
</body>
</html>
