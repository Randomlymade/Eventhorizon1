<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#ddd;font-family:Georgia,serif}#game{width:100%;height:100%}#go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 38px;font:italic 22px Georgia,serif;background:#e8432b;color:#fff;border:0;cursor:pointer;letter-spacing:.02em}#go[disabled]{background:#333;cursor:default}</style></head><body><div id="game"></div><button id="go">Play</button><script>
window.EJS_core="psx";window.EJS_pathtodata="https://cdn.jsdelivr.net/gh/bubblfan/emu@master/";window.__LOADER="https://cdn.jsdelivr.net/gh/bubblfan/emu@master/loader.js";
window.EJS_color="#0064ff";
window.EJS_startOnLoaded="true";
window.EJS_player="#game";
window.EJS_biosUrl="https://cdn.jsdelivr.net/gh/Abdess/retroarch_system@5f96368f6dbad5851cdb16a5041fefec4bdcd305/Sony%20-%20PlayStation/scph5501.bin";
window.EJS_gameName="Final Fantasy Tactics (USA)";
function __fetchRom(){var u=[];for(var i=1;i<=11;i++){u.push("https://cdn.jsdelivr.net/gh/bubbls/ugss@f4ae30e677786b40dee5c161890b1c07139b14db/ff%20tactics/Final%20Fantasy%20Tactics%20(USA).chd"+".part"+String(i).padStart(2,"0"));}return Promise.all(u.map(function(x){return fetch(x).then(function(r){if(!r.ok)throw new Error(r.status);return r.arrayBuffer();});})).then(function(bs){window.EJS_gameUrl=URL.createObjectURL(new Blob(bs));});}

var b=document.getElementById("go");
function boot(){var s=document.createElement("script");s.src=window.__LOADER;document.body.appendChild(s);b.style.display="none";document.getElementById("game").style.display="block";}
b.addEventListener("click",function(){b.disabled=true;b.textContent="Loading…";__fetchRom().then(function(){boot();}).catch(function(e){b.disabled=false;b.textContent="Failed to load – retry";});});
</script></body></html>
